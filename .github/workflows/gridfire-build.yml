name: Gridfire Build

# gridfire_template_version: stage3-ts-node-backend/v1

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch or ref generated by Gridfire.
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout generated ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate backend typings
        run: npm run database:generate-typings

      - name: Build API
        run: npx nx run api:build
